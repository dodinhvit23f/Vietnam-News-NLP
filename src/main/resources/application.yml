server:
  port: 8082
spring:
  application:
    name: news-scanner
  data:
    mongodb:
      port: ${MONGO_DB_PORT:27017}
      username: ${MONGO_DB_USER_NAME:root}
      database: ${MONGO_DB_NAME:news}
      password: ${MONGO_DB_PASSWORD:example}
      host: ${MONGO_DB_HOST:127.0.0.1}
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
      authentication-database: admin

application:
  chrome: ./chromedriver